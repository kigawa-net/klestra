name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get Docker Hub PAT from Bitwarden Secrets Manager
        id: bw
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BITWARDEN_ACCESS_TOKEN }}
          BWS_SECRET_ID: ${{ secrets.BITWARDEN_SECRET_ID }}
        run: |
          # BWS CLIをインストール
          curl -sL https://bws.bitwarden.com/install | sh
          # シークレットを取得
          dockerhub_pat=$(bws secret get $BWS_SECRET_ID --output json | jq -r '.[0].value')
          echo "::add-mask::${dockerhub_pat}"
          echo "dockerhub_pat=${dockerhub_pat}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: kigawa-net
          password: ${{ steps.bw.outputs.dockerhub_pat }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: kigawa-net/klestra:1.1.0
