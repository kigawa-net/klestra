name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get Docker Hub PAT from Bitwarden Secrets Manager
        id: bw
        env:
          BWS_SERVER: https://vault.bitwarden.com
          BWS_SERVICE_ACCOUNT_TOKEN: ${{ secrets.BITWARDEN_SERVICE_ACCOUNT_TOKEN }}
          BWS_SECRET_ID: ${{ secrets.BITWARDEN_SECRET_ID }}
        run: |
          curl -sL https://bws-cli.bitwarden.com/linux-amd64/bws -o /tmp/bws
          chmod +x /tmp/bws
          /tmp/bws login --token $BWS_SERVICE_ACCOUNT_TOKEN --server $BWS_SERVER
          dockerhub_pat=$(/tmp/bws get secret $BWS_SECRET_ID --field pat 2>/dev/null)
          echo "::add-mask::${dockerhub_pat}"
          echo "dockerhub_pat=${dockerhub_pat}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: kigawa-net
          password: ${{ steps.bw.outputs.dockerhub_pat }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: kigawa-net/klestra:1.1.0
